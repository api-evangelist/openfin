name: OpenFin
description: >-
  OpenFin — now branded HERE — is the operating-system layer for enterprise
  financial desktops. Its container/runtime lets web applications run as secure,
  interoperable desktop apps, adding Workspace surfaces (Home, Dock, Store,
  Notifications Center, Browser) and FDC3-based application interop. The developer
  surface is a JavaScript `fin` runtime/container API (with Java and .NET adapters
  and a rich set of @openfin npm packages), not a REST/HTTP API. OpenFin is
  deployed across banks and financial institutions and is backed by Bain Capital
  Ventures. This profile was enriched from OpenFin/HERE's public developer surface.
